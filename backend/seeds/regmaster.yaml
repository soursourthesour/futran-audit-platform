      - code: CA-ADMT-04
        text: "Complete a risk assessment before using ADMT for a significant decision; submit the attestation and summary by 1 Apr 2028"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Risk assessment; attestation"
        role: impact_assessment_owner
        ai_types: [decision]
        citation: "CCPA regulations, risk assessments (section number not confirmed)"
        quote: "By April 1, 2028, covered businesses must submit an attestation"
        source: 1
        verify: true
    role_maps:
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [CA-ADMT-01], basis: "§7220: pre-use notice"}
      - {role: appeals_correction_reviewer, level: required, needed_by: go_live, requirements: [CA-ADMT-02], basis: "§7221: opt-out or human appeal"}
      - {role: explainability_contact, level: required, needed_by: go_live, requirements: [CA-ADMT-03], basis: "§7222: access to ADMT information"}
      - {role: impact_assessment_owner, level: required, needed_by: go_live, requirements: [CA-ADMT-04], basis: "Risk assessment"}
      - {role: data_consent_steward, level: recommended, needed_by: development}
    committees:
      - {type: risk_program, level: required, title: "Risk assessment program", basis: "CCPA regulations (risk assessments from 1 Jan 2026; attestation by 1 Apr 2028)", items: ["Risk assessment before ADMT for significant decisions", "Attestation and summary to the CPPA"]}
      - {type: consequential_decision_rights, level: required, title: "Consequential-decision rights", basis: "CCPA ADMT (from 1 Jan 2027)", items: ["Pre-use notice", "Opt-out or human appeal", "Access to ADMT information"]}

  # ---------------------------------------------------------------- California Civil Rights Council ADS regulations
  - key: ca_ads_rules
    jurisdiction: US-CA
    match: "^FEHA automated-decision system regulations$"
    label: CA ADS rules
    region: us_states
    binding: true
    topics: [hiring]
    version:
      status: in_force
      effective_on: 2025-10-01
      effective_text: "In force 1 Oct 2025"
      scope_text: "Employers and other covered entities, and their agents, that use automated-decision systems in employment decisions in California."
      applies_to: [employer]
      enforcer: "California Civil Rights Department"
      penalty_text: "Remedies under the Fair Employment and Housing Act"
      main_duty: "No discriminatory effect; keep automated-decision data for 4 years; anti-bias testing counts as evidence"
      sources:
        - {name: "Civil Rights Council: approval of ADS regulations (30 Jun 2025)", url: "https://calcivilrights.ca.gov/2025/06/30/civil-rights-council-secures-approval-for-regulations-to-protect-against-employment-discrimination-related-to-artificial-intelligence/", kind: official}
        - {name: "Civil Rights Council: final text (Attachment B)", url: "https://calcivilrights.ca.gov/wp-content/uploads/sites/32/2025/03/Attachment-B-Final-Unmodified-Text-of-Proposed-Employment-Regulations-Regarding-Automated-Decision-Systems.pdf", kind: official}
    scope_tests:
      - {question: "Does the client employ or recruit people in California?", prefill: client_geographies, prefill_codes: [US-CA], rule: {equals: "yes"}}
      - {question: "Does any AI system make or help make employment decisions?", prefill: decision_impact, prefill_feature: employment, rule: {equals: "yes"}}
    requirements:
      - code: CA-ADS-01
        text: "Do not use an automated-decision system that harms applicants or employees based on protected characteristics"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Adverse-impact analysis"
        role: bias_testing_lead
        ai_types: [decision]
        citation: "Cal. Code Regs., tit. 2, §11008.1 et seq. (Civil Rights Council ADS regulations)"
        quote: "may violate California law if it harms applicants or employees based on protected characteristics"
        source: 0
      - code: CA-ADS-02
        text: "Run and document anti-bias testing; its presence or absence is evidence in a claim or defence"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Bias test reports, dates, scope"
        role: bias_testing_lead
        ai_types: [decision]
        citation: "Cal. Code Regs., tit. 2, §11009(f)"
        quote: "Relevant to any such claim or available defense is evidence, or the lack of evidence, of anti-bias testing"
        source: 1
      - code: CA-ADS-03
        text: "Keep employment records, including automated-decision system data, for at least four years"
        applies_to: [employer]
        needed_by: ongoing
        evidence: "Retention schedule covering ADS data"
        role: records_retention_owner
        ai_types: [decision]
        citation: "Cal. Code Regs., tit. 2, §11013(c)"
        quote: "shall be preserved by the employer or other covered entity for a period of four years"
        source: 1
    role_maps:
      - {role: records_retention_owner, level: required, needed_by: ongoing, requirements: [CA-ADS-03], basis: "§11013(c): 4-year records"}
      - {role: bias_testing_lead, level: recommended, needed_by: go_live, requirements: [CA-ADS-01, CA-ADS-02], basis: "§11009(f): anti-bias testing as evidence"}

  # ---------------------------------------------------------------- India CERT-In Directions
  - key: in_certin
    jurisdiction: IN
    match: "CERT-In"
    create:
      short_name: "CERT-In Directions under section 70B(6) of the IT Act (2022)"
      feature: government_other
      type: regulation
      applies_to: deployer
      full_text: "CERT-In Directions No. 20(3)/2022-CERT-In of 28 April 2022 under section 70B(6) of the Information Technology Act, 2000: incident reporting within 6 hours, point of contact, 180-day logs, clock synchronisation."
    label: India CERT-In
    region: india
    binding: true
    topics: [security]
    version:
      status: in_force
      effective_text: "Issued 28 Apr 2022; effective 60 days after issue"
      scope_text: "Service providers, intermediaries, data centres, body corporate and government organisations, including those running AI systems in India."
      applies_to: [deployer]
      enforcer: "CERT-In (Indian Computer Emergency Response Team)"
      penalty_text: "Punitive action under section 70B(7) of the IT Act"
      main_duty: "Report cyber incidents to CERT-In within 6 hours; keep logs for 180 days in India"
      sources:
        - {name: "CERT-In Directions of 28 Apr 2022", url: "https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf", kind: official}
    scope_tests:
      - {question: "Does the client run ICT systems or provide services in India?", prefill: client_geographies, prefill_codes: [IN], rule: {equals: "yes"}}
    requirements:
      - code: CERTIN-01
        text: "Report listed cyber incidents, including those involving AI systems, to CERT-In within 6 hours of noticing them"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Incident procedure with the 6-hour step; reports filed"
        role: incident_response_lead
        ai_types: [all]
        citation: "CERT-In Directions, 28 Apr 2022, direction (ii)"
        quote: "within 6 hours of noticing such incidents"
        source: 0
      - code: CERTIN-02
        text: "Designate a point of contact to interface with CERT-In"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Named point of contact sent to CERT-In"
        role: incident_response_lead
        ai_types: [all]
        citation: "CERT-In Directions, 28 Apr 2022, direction (iii)"
        quote: "designate a Point of Contact to interface with CERT-In"
        source: 0
      - code: CERTIN-03
        text: "Keep ICT system logs for a rolling 180 days within India"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Log retention configuration"
        role: records_retention_owner
        ai_types: [all]
        citation: "CERT-In Directions, 28 Apr 2022, direction (iv)"
        quote: "for a rolling period of 180 days"
        source: 0
      - code: CERTIN-04
        text: "Synchronise system clocks to the NIC or NPL time servers"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "NTP configuration"
        role: technical_owner
        ai_types: [all]
        citation: "CERT-In Directions, 28 Apr 2022, direction (i)"
        quote: "connect to the Network Time Protocol (NTP) Server"
        source: 0
    role_maps:
      - {role: incident_response_lead, level: required, needed_by: go_live, requirements: [CERTIN-01, CERTIN-02], basis: "Directions (ii)–(iii): 6-hour reporting, point of contact"}
      - {role: records_retention_owner, level: required, needed_by: go_live, requirements: [CERTIN-03], basis: "Direction (iv): 180-day logs"}
      - {role: technical_owner, level: required, needed_by: go_live, requirements: [CERTIN-04], basis: "Direction (i): clock synchronisation"}

  # ---------------------------------------------------------------- NIST AI RMF (framework baseline)
  - key: nist_ai_rmf
    jurisdiction: US
    match: "NIST AI Risk Management Framework"
    label: NIST / ISO
    region: framework
    binding: false
    topics: [framework]
    version:
      status: guidance
      effective_text: "Version 1.0, January 2023"
      scope_text: "Any organisation designing, developing, deploying or using AI. Voluntary; Futran's audit baseline."
      applies_to: [developer, deployer]
      enforcer: "None (voluntary)"
      penalty_text: "None (voluntary)"
      main_duty: "Futran's audit baseline: governance roles, testing, incident handling"
      sources:
        - {name: "NIST AI RMF Core (AI Resource Center)", url: "https://airc.nist.gov/airmf-resources/airmf/5-sec-core/", kind: official}
    scope_tests:
      - {question: "Futran baseline: applies to every client", rule: {any: true}}
    requirements:
      - {code: NIST-GV2.1, text: "Document roles, responsibilities and lines of communication for managing AI risk", applies_to: [deployer], needed_by: development, evidence: "RACI; role appointments", role: ai_compliance_officer, ai_types: [all], citation: "NIST AI RMF GOVERN 2.1", quote: "Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented", source: 0}
      - {code: NIST-GV2.3, text: "Executive leadership takes responsibility for decisions about AI risk", applies_to: [deployer], needed_by: development, evidence: "Board or executive resolution", role: accountable_executive, ai_types: [all], citation: "NIST AI RMF GOVERN 2.3", quote: "Executive leadership of the organization takes responsibility for decisions about risks associated with AI system", source: 0}
      - {code: NIST-GV3.1, text: "AI risk decisions are informed by a diverse team", applies_to: [deployer], needed_by: program_setup, evidence: "Committee charter and membership", role: ai_governance_committee, ai_types: [all], citation: "NIST AI RMF GOVERN 3.1", quote: "Decision-making related to mapping, measuring, and managing AI risks throughout the lifecycle is informed by a diverse team", source: 0}
      - {code: NIST-GV6.1, text: "Policies address AI risks from third parties", applies_to: [deployer], needed_by: procurement, evidence: "Vendor AI risk procedure", role: vendor_ai_risk_owner, ai_types: [all], citation: "NIST AI RMF GOVERN 6.1", quote: "Policies and procedures are in place that address AI risks associated with third-party entities", source: 0}
      - {code: NIST-MS2.11, text: "Evaluate fairness and bias and document the results", applies_to: [deployer], needed_by: go_live, evidence: "Bias test report", role: bias_testing_lead, ai_types: [decision], citation: "NIST AI RMF MEASURE 2.11", quote: "Fairness and bias – as identified in the map function – are evaluated and results are documented.", source: 0}
      - {code: NIST-MG2.4, text: "Assign responsibility to supersede, disengage or deactivate an AI system that behaves outside its intended use", applies_to: [deployer], needed_by: go_live, evidence: "Named stop authority; procedure", role: stop_authority, ai_types: [agent], citation: "NIST AI RMF MANAGE 2.4", quote: "Mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage", source: 0}
      - {code: NIST-MG4.3, text: "Communicate incidents and errors to relevant AI actors, including affected communities", applies_to: [deployer], needed_by: go_live, evidence: "Incident procedure; communications", role: incident_response_lead, ai_types: [all], citation: "NIST AI RMF MANAGE 4.3", quote: "Incidents and errors are communicated to relevant AI actors, including affected communities.", source: 0}
    role_maps:
      - {role: accountable_executive, level: recommended, needed_by: development, requirements: [NIST-GV2.3], basis: "GOVERN 2.3"}
      - {role: ai_governance_committee, level: recommended, needed_by: program_setup, requirements: [NIST-GV3.1], basis: "GOVERN 2.1, 3.1"}
      - {role: ai_compliance_officer, level: recommended, needed_by: development, requirements: [NIST-GV2.1], basis: "GOVERN 2.1"}
      - {role: vendor_ai_risk_owner, level: recommended, needed_by: procurement, requirements: [NIST-GV6.1], basis: "GOVERN 6.1"}
      - {role: ai_system_owner, level: recommended, needed_by: development, basis: "GOVERN 2.1"}
      - {role: technical_owner, level: recommended, needed_by: go_live, basis: "GOVERN 2.1"}
      - {role: human_oversight_person, level: recommended, needed_by: go_live, basis: "GOVERN 2.1, MANAGE"}
      - {role: stop_authority, level: recommended, needed_by: go_live, requirements: [NIST-MG2.4], basis: "MANAGE 2.4"}
      - {role: agent_permissions_approver, level: recommended, needed_by: go_live, basis: "GOVERN 2.1"}
      - {role: bias_testing_lead, level: recommended, needed_by: go_live, requirements: [NIST-MS2.11], basis: "MEASURE 2.11"}
      - {role: incident_response_lead, level: recommended, needed_by: go_live, requirements: [NIST-MG4.3], basis: "GOVERN 4.3, MANAGE 4.3"}
      - {role: ai_literacy_owner, level: recommended, needed_by: go_live}
    committees:
      - {type: ai_governance_committee, level: recommended, title: "AI Governance Committee", basis: "NIST GOVERN 2.1 and 3.1; ISO/IEC 42001 §5.3", composition: "Chair: accountable executive. Members: AI Compliance Officer, Legal, Data Protection Officer, a technical lead and a business or HR lead.", cadence: "At least quarterly", triggers: "Approves high-risk (Tier 3) systems, policies and exceptions", items: ["Chair: accountable executive", "Members: AI Compliance Officer, Legal, DPO, technical lead, a business or HR lead", "Approves Tier 3 systems and exceptions", "Meets at least quarterly"]}
