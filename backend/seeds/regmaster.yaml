        needed_by: go_live
        evidence: "Access request procedure, response log"
        role: explainability_contact
        ai_types: [decision]
        citation: "11 CCR §7222 (definition in §7001(jj))"
        quote: "a consumer request that a business provide information to the consumer about the business's use of ADMT"
