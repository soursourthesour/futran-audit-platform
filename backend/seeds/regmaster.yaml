        needed_by: go_live
        evidence: "Opt-out link or appeal route; reviewer"
        role: appeals_correction_reviewer
        ai_types: [decision]
        citation: "11 CCR §7221 (referenced in §7010(d))"
        quote: "a link through which consumers can opt-out of the business's use of ADMT"
