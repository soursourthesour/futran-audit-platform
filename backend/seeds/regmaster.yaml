laws:
  # ---------------------------------------------------------------- NYC Local Law 144
  - key: nyc_ll144
    jurisdiction: US-NYC
    match: "Local Law 144"
    label: NYC LL144
    region: us_states
    binding: true
    topics: [hiring]
    version:
      status: in_force
      effective_on: 2023-01-01
      compliance_on: 2023-07-05
      effective_text: "Law effective 1 Jan 2023; DCWP enforcement from 5 Jul 2023"
      scope_text: "Employers and employment agencies that use an automated employment decision tool to screen candidates or employees for hiring or promotion in New York City."
      applies_to: [employer]
      enforcer: "NYC Department of Consumer and Worker Protection (DCWP)"
      penalty_text: "Civil penalty of up to $500 for a first violation and $500 to $1,500 for each subsequent violation (§20-872(a))."
      main_duty: "Yearly independent bias audit; publish the summary; notice 10 business days before use"
      sources:
        - {name: "Local Law 144 of 2021 (enacted text)", url: "https://legistar.council.nyc.gov/View.ashx?GUID=F99584B7-57C8-469E-9637-46A0E780690E&ID=10399761&M=F", kind: official}
        - {name: "DCWP: Automated employment decision tools", url: "https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page", kind: official}
    scope_tests:
      - {question: "Does the client hire or promote people for roles in New York City?", prefill: client_geographies, prefill_codes: [US-NYC], rule: {equals: "yes"}}
      - {question: "Does any AI system substantially assist or replace decisions on hiring or promotion?", prefill: decision_impact, prefill_feature: employment, rule: {equals: "yes"}}
    requirements:
      - code: LL144-01
        text: "Have the tool bias-audited no more than one year before each use"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Bias audit report dated within the past 12 months; auditor independence statement"
        role: bias_testing_lead
        ai_types: [decision]
        citation: "NYC Admin. Code §20-871(a)(1)"
        quote: "Such tool has been the subject of a bias audit conducted no more than one year prior to the use of such tool"
        source: 0
      - code: LL144-02
        text: "Publish a summary of the results of the most recent bias audit on the website before use"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Published summary page and its date"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "NYC Admin. Code §20-871(a)(2)"
        quote: "A summary of the results of the most recent bias audit of such tool"
        source: 0
      - code: LL144-03
        text: "Tell each NYC candidate or employee that the tool will be used, at least 10 business days before use, and allow a request for an alternative process or accommodation"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Notice text, delivery log, alternative process"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "NYC Admin. Code §20-871(b)(1)"
        quote: "Such notice shall be made no less than ten business days before such use and allow a candidate to request an alternative selection process or accommodation"
        source: 0
      - code: LL144-04
        text: "Tell candidates and employees the job qualifications and characteristics the tool will assess, at least 10 business days before use"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Notice text listing qualifications and characteristics"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "NYC Admin. Code §20-871(b)(2)"
        quote: "Such notice shall be made no less than 10 business days before such use"
        source: 0
      - code: LL144-05
        text: "Disclose the type of data the tool collects, if it is not already on the website"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Website disclosure or response template"
        role: data_consent_steward
        ai_types: [decision]
        citation: "NYC Admin. Code §20-871(b)(3)"
        quote: "If not disclosed on the employer or employment agency's website, information about the type of data collected"
        source: 0
    role_maps:
      - {role: bias_testing_lead, level: required, needed_by: go_live, requirements: [LL144-01], basis: "§20-871(a)(1): independent bias audit within one year"}
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [LL144-02, LL144-03, LL144-04], basis: "§20-871(a)(2), (b): summary and notices"}
      - {role: data_consent_steward, level: required, needed_by: go_live, requirements: [LL144-05], basis: "§20-871(b)(3): data disclosure"}

  # ---------------------------------------------------------------- Colorado SB 26-189
  - key: co_sb26_189
    jurisdiction: US-CO
    match: "^SB 26-189$"
    label: Colorado
    region: us_states
    binding: true
    topics: [consumer_decisions, hiring]
    version:
      status: enacted_not_in_force
      signed_on: 2026-05-14
      compliance_on: 2027-01-01
      effective_text: "Signed 14 May 2026; applies to consequential decisions made on or after 1 Jan 2027"
      scope_text: "Developers and deployers of automated decision-making technology (ADMT) used to materially influence a consequential decision about a Colorado consumer: education, employment, financial or lending services, insurance, health care, and essential government services and public benefits."
      applies_to: [developer, deployer]
      enforcer: "Colorado Attorney General only. No private right of action."
      private_right_of_action: false
      penalty_text: "A violation is a deceptive trade practice under the Colorado Consumer Protection Act (§6-1-105(1)(uuuu), C.R.S.)."
      cure_period: "60 days after a notice of violation where a cure is possible; none for knowing or repeated violations; the cure right is repealed on 1 Jan 2030"
      removed_text: "SB 24-205's duty of reasonable care, risk management program and annual impact assessments"
      exemptions_text: "Insurers subject to §10-3-1104.9, C.R.S. are generally deemed compliant; HIPAA-covered entities and FDA-regulated devices are largely excluded (law firm summaries; verify against the signed act)"
      litigation_text: "A legal challenge by xAI is reported as pending (law firm summaries); status not confirmed from court records"
      main_duty: "Notice before use; explanation within 30 days of an adverse outcome; correction; human review; 3-year records"
      verify: true
      change_summary: "SB 26-189 repeals and re-enacts SB 24-205: program, impact assessments and duty of care removed; notice, explanation, correction and human review kept; applies from 1 Jan 2027. Section numbers taken from the engrossed bill."
      sources:
        - {name: "Colorado Division of Real Estate: SB26-189 summary", url: "https://dre.colorado.gov/sb26-189-summary", kind: official}
        - {name: "SB26-189 engrossed bill text", url: "https://leg.colorado.gov/bill_files/115943/download", kind: official}
        - {name: "Colorado General Assembly: SB26-189", url: "https://leg.colorado.gov/bills/sb26-189", kind: official}
        - {name: "Colorado AG: ADMT rulemaking", url: "https://coag.gov/ai/", kind: official}
        - {name: "Holland & Knight: Colorado Governor signs SB 189 (18 May 2026)", url: "https://www.hklaw.com/en/insights/publications/2026/05/colorado-governor-signs-sb-189", kind: secondary}
        - {name: "Davis Wright Tremaine: Colorado AI Act repeal", url: "https://www.dwt.com/blogs/privacy--security-law-blog/2026/05/colorado-ai-act-repeal-new-transparency-law", kind: secondary}
    scope_tests:
      - {question: "Does the client make decisions about Colorado residents?", prefill: client_geographies, prefill_codes: [US-CO], rule: {equals: "yes"}}
      - {question: "Does any AI system materially influence a consequential decision: employment, housing, credit, insurance, health care, education or government services?", prefill: decision_impact, rule: {equals: "yes"}}
      - {question: "Is the client the developer, the deployer, or both?", answer_type: pick, prefill: built_or_bought, rule: {any: true}, decisive: false, note: "Developer duties: documentation and 3-year retention. Deployer duties: notice, explanation, correction, human review, 3-year retention."}
    requirements:
      - code: CO-01
        text: "Give deployers documentation: intended and known harmful uses, data categories, known limitations and risks, instructions for use and human review"
        applies_to: [developer]
        needed_by: procurement
        evidence: "Documentation pack received from the vendor"
        role: vendor_ai_risk_owner
        ai_types: [decision]
        citation: "§6-1-1702(1), C.R.S. (SB 26-189)"
        quote: "ON AND AFTER JANUARY 1, 2027, A DEVELOPER SHALL MAKE AVAILABLE TO EACH DEPLOYER"
        source: 1
        verify: true
      - code: CO-02
        text: "Developer keeps compliance records for at least 3 years"
        applies_to: [developer]
        needed_by: ongoing
        evidence: "Retention schedule"
        role: records_retention_owner
        ai_types: [decision]
        citation: "§6-1-1702(4), C.R.S. (SB 26-189)"
        quote: "A DEVELOPER SHALL RETAIN, FOR NOT LESS THAN THREE YEARS"
        source: 1
        verify: true
      - code: CO-03
        text: "Deployer keeps records for at least 3 years after a consequential decision"
        applies_to: [deployer]
        needed_by: ongoing
        evidence: "Retention schedule; decision records"
        role: records_retention_owner
        ai_types: [decision]
        citation: "§6-1-1703, C.R.S. (SB 26-189)"
        quote: "A DEPLOYER SHALL RETAIN, FOR NOT LESS THAN THREE YEARS"
        source: 1
        verify: true
      - code: CO-04
        text: "Give clear and conspicuous notice before ADMT is used to materially influence a consequential decision"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Notice text, where it is shown, delivery log"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "§6-1-1704(1), C.R.S. (SB 26-189)"
        quote: "PRIOR TO A DEPLOYER USING A COVERED ADMT TO MATERIALLY INFLUENCE"
        source: 1
        verify: true
      - code: CO-05
        text: "Within 30 days of an adverse outcome, give a plain-language description of the decision and the role ADMT played, how to request more information, and the person's rights"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Explanation template, response log"
        role: explainability_contact
        ai_types: [decision]
        citation: "§6-1-1704(3), C.R.S. (SB 26-189)"
        quote: "WITHIN THIRTY DAYS AFTER MAKING THE DECISION"
        source: 1
        verify: true
      - code: CO-06
        text: "Let the person correct factually incorrect or materially inaccurate personal data"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Correction process, log"
        role: appeals_correction_reviewer
        ai_types: [decision]
        citation: "§6-1-1705(1)(a)(I), C.R.S. (SB 26-189)"
        quote: "CORRECTING FACTUALLY INCORRECT OR MATERIALLY INACCURATE PERSONAL DATA"
        source: 1
        verify: true
      - code: CO-07
        text: "Offer meaningful human review and reconsideration, to the extent commercially reasonable, by a reviewer who can override the decision"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Review procedure, case log, reviewer authority"
        role: human_oversight_person
        ai_types: [decision]
        citation: "§6-1-1705(1)(a)(II), C.R.S. (SB 26-189)"
        quote: "AN OPPORTUNITY FOR MEANINGFUL HUMAN REVIEW AND RECONSIDERATION"
        source: 1
        verify: true
      - code: CO-08
        text: "Follow Attorney General rules on adverse-outcome disclosures, correction and human review once adopted (due by 1 Jan 2027)"
        applies_to: [developer, deployer]
        needed_by: ongoing
        evidence: "Set when the rules are published"
        role: ai_compliance_officer
        ai_types: [decision]
        citation: "§6-1-1704(4)(b), §6-1-1705(3), C.R.S. (SB 26-189)"
        quote: "ON OR BEFORE JANUARY 1, 2027, THE ATTORNEY GENERAL SHALL ADOPT RULES"
        source: 1
        verify: true
    role_maps:
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [CO-04], basis: "CO-04: notice before use"}
      - {role: explainability_contact, level: required, needed_by: go_live, requirements: [CO-05], basis: "CO-05: explanation within 30 days"}
      - {role: appeals_correction_reviewer, level: required, needed_by: go_live, requirements: [CO-06], basis: "CO-06: data correction"}
      - {role: human_oversight_person, level: required, needed_by: go_live, requirements: [CO-07], basis: "CO-07: human review where commercially reasonable"}
      - {role: records_retention_owner, level: required, needed_by: ongoing, requirements: [CO-02, CO-03], basis: "CO-02, CO-03: 3-year records"}
      - {role: vendor_ai_risk_owner, level: recommended, needed_by: procurement, requirements: [CO-01], basis: "CO-01: receives developer documentation"}
      - {role: ai_compliance_officer, level: recommended, needed_by: development, requirements: [CO-08], basis: "CO-08: tracks AG rules"}
    committees:
      - {type: consequential_decision_rights, level: required, title: "Consequential-decision rights", basis: "Colorado SB 26-189 (from 1 Jan 2027)", items: ["Notice before use", "Explanation after an adverse outcome; data correction", "Human review or reconsideration", "Colorado no longer requires a risk program or impact assessments"]}

  # ---------------------------------------------------------------- Illinois HB 3773
  - key: il_hb3773
    jurisdiction: US-IL
    match: "HB 3773"
    label: Illinois HB 3773
    region: us_states
    binding: true
    topics: [hiring]
    version:
      status: in_force
      effective_on: 2026-01-01
      effective_text: "In force 1 Jan 2026"
      scope_text: "Employers that use artificial intelligence for recruitment, hiring, promotion, renewal of employment, selection for training or apprenticeship, discharge, discipline, tenure, or the terms, privileges or conditions of employment."
      applies_to: [employer]
      enforcer: "Illinois Department of Human Rights"
      penalty_text: "Remedies under the Illinois Human Rights Act"
      main_duty: "Notify employees of AI use in employment decisions; no discriminatory effect; no zip-code proxies"
      litigation_text: "IDHR issued draft notice rules (Subpart J) and withdrew them on 2 Jun 2026 to revise them (law firm report; verify on dhr.illinois.gov)"
      sources:
        - {name: "Illinois General Assembly: Public Act 103-0804", url: "https://www.ilga.gov/Legislation/publicacts/view/103-0804", kind: official}
        - {name: "HB3773 enrolled text (LegiScan mirror)", url: "https://legiscan.com/IL/text/HB3773/2023", kind: secondary}
        - {name: "Burke Warren: IDHR withdraws proposed AI rules", url: "https://www.burkelaw.com/alert-illinois-department-of-human-rights-withdraws-proposed-ai-in-employment-rules", kind: secondary}
    scope_tests:
      - {question: "Does the client employ or recruit people in Illinois?", prefill: client_geographies, prefill_codes: [US-IL], rule: {equals: "yes"}}
      - {question: "Does any AI system play a part in recruitment, hiring, promotion, discipline, discharge or other terms of employment?", prefill: decision_impact, prefill_feature: employment, rule: {equals: "yes"}}
    requirements:
      - code: IL-01
        text: "Do not use AI that has the effect of subjecting employees to discrimination on the basis of protected classes"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Bias testing results; adverse-impact review"
        role: bias_testing_lead
        ai_types: [decision]
        citation: "775 ILCS 5/2-102(L)(1)"
        quote: "for an employer to use artificial intelligence that has the effect of subjecting employees to discrimination on the basis of protected classes under this Article"
        source: 1
      - code: IL-02
        text: "Do not use zip codes as a proxy for protected classes"
        applies_to: [employer]
        needed_by: development
        evidence: "Model input list; feature review"
        role: data_consent_steward
        ai_types: [decision]
        citation: "775 ILCS 5/2-102(L)(1)"
        quote: "or to use zip codes as a proxy for protected classes under this Article"
        source: 1
      - code: IL-03
        text: "Notify employees that the employer uses AI for these employment purposes"
        applies_to: [employer]
        needed_by: go_live
        evidence: "Notice text, where and when it is given"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "775 ILCS 5/2-102(L)(2)"
        quote: "For an employer to fail to provide notice to an employee that the employer is using artificial intelligence for the purposes described in paragraph (1)."
        source: 1
      - code: IL-04
        text: "Follow the Department's rules on when, how and how soon notice is given, once adopted"
        applies_to: [employer]
        needed_by: ongoing
        evidence: "Set when the rules are adopted"
        role: ai_compliance_officer
        ai_types: [decision]
        citation: "775 ILCS 5/2-102(L)"
        quote: "The Department shall adopt any rules necessary for the implementation and enforcement of this subdivision, including, but not limited to, rules on the circumstances and conditions that require notice, the time period for providing notice, and the means for providing notice."
        source: 1
    role_maps:
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [IL-03], basis: "IL-03: employee notice"}
