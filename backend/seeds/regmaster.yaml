# Regulatory master seed (spec §24.1, §25). Loaded by `python -m app.cli seed-regmaster` and by the demo loader.
# Every requirement quotes the source it was read from on 30 Oct 2026. `verify: true` marks an item whose section
# number or wording could not be confirmed against the final official text; the law record shows a Verify badge.
# Stages: program_setup | procurement | development | go_live | ongoing | yearly.
# AI types: decision (AI or ML software deciding about people) | agent | embedded | genai | all.

roles:
  - {code: accountable_executive, number: 1, name: Accountable executive, level: company, default_stage: development, main_sources: "NIST GOVERN 2.3; ISO 42001 §5.1", description: "Owns AI risk decisions; signs the AI policy"}
  - {code: ai_governance_committee, number: 2, name: AI Governance Committee, level: company, default_stage: program_setup, main_sources: "NIST GOVERN 2.1, 3.1; ISO 42001 §5.3 (recommended)", description: "Approves high-risk uses, policies and exceptions", headline_code: GR-01}
  - {code: ai_compliance_officer, number: 3, name: AI Compliance Officer, level: company, default_stage: development, main_sources: "EU AI Act Art. 26; NIST GOVERN 2", description: "Runs the AI risk program and the register"}
  - {code: dpo, number: 4, name: Data Protection Officer, level: company, default_stage: go_live, main_sources: "GDPR Art. 37; India DPDP §10", description: "Data protection reviews and assessments"}
  - {code: grievance_officer_india, number: 5, name: Grievance officer (India), level: company, default_stage: go_live, main_sources: "DPDP §8(10); IT Rules 2021", description: "Answers data principals' complaints"}
  - {code: incident_response_lead, number: 6, name: AI Incident Response Lead, level: company, default_stage: go_live, main_sources: "EU AI Act Art. 26(5), 73; CERT-In (6 hours)", description: "Logs incidents; reports to regulators on time", headline_code: GR-06}
  - {code: ai_literacy_owner, number: 7, name: AI literacy and training owner, level: company, default_stage: go_live, main_sources: "EU AI Act Art. 4", description: "Trains staff who use or oversee AI", headline_code: GR-07}
  - {code: vendor_ai_risk_owner, number: 8, name: Vendor AI risk owner, level: company, default_stage: procurement, main_sources: "NIST GOVERN 6.1; EU AI Act Art. 25", description: "Vendor due diligence and AI contract terms"}
  - {code: records_retention_owner, number: 9, name: Records retention owner, level: company, default_stage: go_live, main_sources: "EU AI Act Art. 26(6); CA ADS rules (4 yrs); Colorado SB 26-189 (3 yrs)", description: "Keeps logs, audits and assessments for the required time"}
  - {code: ai_system_owner, number: 10, name: AI System Owner, level: system, default_stage: development, main_sources: "NIST GOVERN 2.1", description: "Business owner of the use case", headline_code: GR-04}
  - {code: technical_owner, number: 11, name: Technical owner, level: system, default_stage: go_live, main_sources: "EU AI Act Art. 26(5)–(6)", description: "Operates, monitors and logs the system"}
  - {code: human_oversight_person, number: 12, name: Human oversight person, level: system, default_stage: go_live, main_sources: "EU AI Act Art. 14, 26(2); Colorado human review", description: "Reviews, corrects or overrides the AI system's outputs", extra_checks: oversight_confirmations, headline_code: GR-05}
  - {code: stop_authority, number: 13, name: Stop / disengage authority, level: agent, default_stage: go_live, main_sources: "EU AI Act Art. 14(4)(e); NIST MANAGE 2.4", description: "Can halt the agent or revoke its permissions"}
  - {code: agent_permissions_approver, number: 14, name: Agent permissions approver, level: agent, default_stage: go_live, main_sources: "NIST GOVERN 2.1; enforced by GuardRail", description: "Approves the actions, tools and data an agent may use"}
  - {code: explainability_contact, number: 15, name: Explainability contact, level: system, default_stage: go_live, main_sources: "EU AI Act Art. 86; Colorado (30-day explanation); CCPA ADMT", description: "Explains an individual decision to the person affected", headline_code: GR-03}
  - {code: appeals_correction_reviewer, number: 16, name: Appeals and correction reviewer, level: system, default_stage: go_live, main_sources: "Colorado; CCPA ADMT", description: "Hears appeals with human review; corrects data"}
  - {code: bias_testing_lead, number: 17, name: Bias testing lead / independent auditor, level: system, default_stage: go_live, main_sources: "NYC LL144; CA ADS rules; NIST MEASURE 2.11", description: "Runs or commissions bias tests", headline_code: GR-02}
  - {code: impact_assessment_owner, number: 18, name: Impact assessment owner, level: system, default_stage: go_live, main_sources: "EU AI Act Art. 27; CCPA risk assessment; DPDP (SDF)", description: "Completes the impact or risk assessment"}
  - {code: transparency_notice_owner, number: 19, name: Transparency and notice owner, level: system, default_stage: go_live, main_sources: "NYC LL144; IL HB 3773; EU AI Act Art. 26(11), 50; Colorado", description: "Tells people AI is used; publishes notices"}
  - {code: data_consent_steward, number: 20, name: Data and consent steward, level: system, default_stage: development, main_sources: "DPDP; CCPA; GDPR; EU AI Act Art. 10", description: "Confirms consent or lawful basis for the data"}
  - {code: worker_rep_contact, number: 21, name: Worker representative contact, level: system, default_stage: go_live, main_sources: "EU AI Act Art. 26(7)", description: "Informs worker representatives before workplace use"}

