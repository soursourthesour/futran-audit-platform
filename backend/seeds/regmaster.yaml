      - {role: data_consent_steward, level: recommended, needed_by: development, requirements: [IL-02], basis: "IL-02: no zip-code proxies"}

  # ---------------------------------------------------------------- EU AI Act
  - key: eu_ai_act
    jurisdiction: EU
    match: "2024/1689"
    label: EU AI Act
    region: eu
    binding: true
    topics: [consumer_decisions, hiring, genai, frontier]
    version:
      status: in_force_phased
      effective_on: 2024-08-01
      effective_text: "Phased: AI literacy and prohibitions from 2 Feb 2025; transparency (Art. 50) from 2 Aug 2026; Annex III high-risk from 2 Dec 2027; Annex I high-risk from 2 Aug 2028 (as amended by Regulation (EU) 2026/1744)"
      scope_text: "Providers and deployers of AI systems placed on the market or used in the EU, wherever they are based. Most deployer duties apply to high-risk systems (Annex III, such as employment, credit and essential services)."
      applies_to: [provider, deployer]
      enforcer: "National market surveillance authorities; the AI Office for general-purpose AI models"
      penalty_text: "Up to EUR 35 million or 7% of worldwide annual turnover for prohibited practices; up to EUR 15 million or 3% for other duties, including deployer duties under Art. 26 and transparency under Art. 50 (Art. 99(3)–(4))"
      main_duty: "AI literacy; human oversight, logs and notices for high-risk use; tell people when they deal with AI"
      change_summary: "Consolidated text as at 27 Jul 2026, including Regulation (EU) 2026/1744 (Digital Omnibus on AI): Annex III high-risk duties move from 2 Aug 2026 to 2 Dec 2027; Art. 4 AI literacy kept in revised form."
      sources:
        - {name: "EUR-Lex: Regulation (EU) 2024/1689, consolidated 27 Jul 2026", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A02024R1689-20260727", kind: official}
        - {name: "AI Act Service Desk: Article 26", url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26", kind: official}
        - {name: "AI Act Service Desk: Article 99", url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-99", kind: official}
        - {name: "AI Act Service Desk: Article 73", url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-73", kind: official}
        - {name: "AI Act Service Desk: Article 50", url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50", kind: official}
        - {name: "AI Act Service Desk: Article 86", url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-86", kind: official}
        - {name: "Cuatrecasas: Digital Omnibus on AI has been published", url: "https://www.cuatrecasas.com/en/spain/intellectual-property/art/digital-omnibus-ai-has-been-published", kind: secondary}
    scope_tests:
      - {question: "Does the client place AI on the EU market, or use AI in the EU, or is the output of its AI used in the EU?", prefill: client_geographies, prefill_codes: [EU], rule: {equals: "yes"}}
      - {question: "Is any AI system high-risk (Annex III: employment, credit, insurance, education, essential services, biometrics)?", prefill: decision_impact, rule: {any: true}, decisive: false, note: "High-risk use adds the Art. 26 deployer duties; AI literacy applies to every AI system."}
    requirements:
      - code: EU-01
        text: "Take measures to support the AI literacy of staff and others who operate or use AI on the client's behalf"
        applies_to: [provider, deployer]
        needed_by: go_live
        evidence: "Training plan, completion records"
        role: ai_literacy_owner
        ai_types: [all]
        citation: "EU AI Act Art. 4 (as amended by Reg. (EU) 2026/1744)"
        quote: "Providers and deployers of AI systems shall take measures to support the development of AI literacy of their staff"
        source: 0
      - code: EU-02
        text: "Use high-risk AI in line with the provider's instructions for use"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Instructions for use; operating procedure"
        role: technical_owner
        ai_types: [decision]
        citation: "EU AI Act Art. 26(1)"
        quote: "shall take appropriate technical and organisational measures to ensure they use such systems"
        source: 1
      - code: EU-03
        text: "Assign human oversight to people with the competence, training and authority to do it"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Appointment, training record, authority to override"
        role: human_oversight_person
        ai_types: [decision, agent]
        citation: "EU AI Act Art. 26(2)"
        quote: "competence, training and authority"
        source: 1
      - code: EU-04
        text: "Monitor the system and, on a serious incident, inform the provider first and then the authorities"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Monitoring procedure; incident log"
        role: incident_response_lead
        ai_types: [decision]
        citation: "EU AI Act Art. 26(5)"
        quote: "Where deployers have identified a serious incident, they shall also immediately inform first the provider"
        source: 1
      - code: EU-05
        text: "Keep the system's automatically generated logs for at least six months"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Log retention setting; retention schedule"
        role: records_retention_owner
        ai_types: [decision]
        citation: "EU AI Act Art. 26(6)"
        quote: "at least six months"
        source: 1
      - code: EU-06
        text: "Before workplace use, inform workers' representatives and the affected workers"
        applies_to: [deployer, employer]
        needed_by: go_live
        evidence: "Notice to works council or representatives; date"
        role: worker_rep_contact
        ai_types: [decision]
        citation: "EU AI Act Art. 26(7)"
        quote: "that they will be subject to the use"
        source: 1
      - code: EU-07
        text: "Tell people that a high-risk system is used to make or help make decisions about them"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Notice text, delivery"
        role: transparency_notice_owner
        ai_types: [decision]
        citation: "EU AI Act Art. 26(11)"
        quote: "shall inform the natural persons that they are subject to the use of the high-risk AI system"
        source: 0
      - code: EU-08
        text: "Complete a fundamental rights impact assessment before use, where the deployer is a public body, provides public services, or uses AI for credit scoring or life and health insurance pricing"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Completed assessment"
        role: impact_assessment_owner
        ai_types: [decision]
        citation: "EU AI Act Art. 27(1)"
        quote: "Prior to deploying a high-risk AI system referred to in Article 6(2)"
        source: 0
      - code: EU-09
        text: "Disclose deep fakes as artificially generated or manipulated, and tell people exposed to emotion recognition or biometric categorisation"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Labels, notices"
        role: transparency_notice_owner
        ai_types: [genai]
        citation: "EU AI Act Art. 50(3)–(4)"
        quote: "Deployers of an AI system that generates or manipulates image, audio or video content constituting a deep fake"
        source: 4
      - code: EU-10
        text: "Tell people when they are interacting with an AI system, unless it is obvious"
        applies_to: [provider]
        needed_by: go_live
        evidence: "Chat disclosure text"
        role: transparency_notice_owner
        ai_types: [genai]
        citation: "EU AI Act Art. 50(1)"
        quote: "Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed"
        source: 4
      - code: EU-11
        text: "On request, give a clear and meaningful explanation of the AI system's role in a decision about the person"
        applies_to: [deployer]
        needed_by: go_live
        evidence: "Explanation procedure, response log"
        role: explainability_contact
        ai_types: [decision]
        citation: "EU AI Act Art. 86(1)"
        quote: "obtain from the deployer clear and meaningful explanations of the role of the AI system in the decision-making procedure"
        source: 5
      - code: EU-12
        text: "Make sure the people overseeing a high-risk system can intervene or stop it"
        applies_to: [provider, deployer]
        needed_by: go_live
        evidence: "Stop procedure; named authority"
        role: stop_authority
        ai_types: [agent, decision]
        citation: "EU AI Act Art. 14(4)(e)"
        quote: "to intervene in the operation of the high-risk AI system or interrupt the system through a 'stop' button"
        source: 0
      - code: EU-13
        text: "Report a serious incident to the market surveillance authority no later than 15 days after becoming aware (2 days for widespread infringements, 10 days for a death)"
        applies_to: [provider, deployer]
        needed_by: go_live
        evidence: "Incident procedure with deadlines; reports filed"
        role: incident_response_lead
        ai_types: [decision]
        citation: "EU AI Act Art. 73(2)–(4)"
        quote: "not later than 15 days after the provider or, where applicable, the deployer, becomes aware of the serious incident"
        source: 3
    role_maps:
      - {role: ai_literacy_owner, level: required, needed_by: go_live, requirements: [EU-01], basis: "Art. 4: AI literacy"}
      - {role: technical_owner, level: required, needed_by: go_live, requirements: [EU-02], basis: "Art. 26(1): use per instructions (high-risk)"}
      - {role: human_oversight_person, level: required, needed_by: go_live, requirements: [EU-03], basis: "Art. 14, 26(2): deployer assigns oversight to trained people"}
      - {role: incident_response_lead, level: required, needed_by: go_live, requirements: [EU-04, EU-13], basis: "Art. 26(5), 73: serious incidents"}
      - {role: records_retention_owner, level: required, needed_by: go_live, requirements: [EU-05], basis: "Art. 26(6): logs for at least six months"}
      - {role: worker_rep_contact, level: required, needed_by: go_live, requirements: [EU-06], basis: "Art. 26(7): workplace use"}
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [EU-07, EU-09, EU-10], basis: "Art. 26(11), 50: notices and disclosure"}
      - {role: impact_assessment_owner, level: required, needed_by: go_live, requirements: [EU-08], basis: "Art. 27: certain deployers only"}
      - {role: explainability_contact, level: required, needed_by: go_live, requirements: [EU-11], basis: "Art. 86: right to explanation"}
      - {role: stop_authority, level: required, needed_by: go_live, requirements: [EU-12], basis: "Art. 14(4)(e): high-risk systems"}
      - {role: ai_compliance_officer, level: recommended, needed_by: development, basis: "Art. 26: someone must run the deployer duties"}
      - {role: vendor_ai_risk_owner, level: recommended, needed_by: procurement, basis: "Art. 25: value chain responsibilities"}
      - {role: data_consent_steward, level: recommended, needed_by: development, basis: "Art. 10: data governance (providers)"}
      - {role: dpo, level: recommended, needed_by: go_live, basis: "Works with GDPR assessments"}
      - {role: accountable_executive, level: recommended, needed_by: development}
    committees:
      - {type: quality_management_system, level: required, title: "Quality management system", basis: "EU AI Act Art. 17 (providers of high-risk AI; text not re-read for this seed)", condition: "Applies only if the client builds and sells high-risk AI", items: ["Accountability framework with named roles", "Post-market monitoring and incident reporting"]}

  # ---------------------------------------------------------------- GDPR
  - key: gdpr
    jurisdiction: EU
    match: "^GDPR"
    label: GDPR
    region: eu
    binding: true
    topics: [personal_data]
    version:
      status: in_force
      effective_on: 2018-05-25
      effective_text: "Applies from 25 May 2018"
      scope_text: "Controllers and processors of personal data of people in the EU, including automated decision-making and profiling."
      applies_to: [data_fiduciary]
      enforcer: "National data protection authorities"
      penalty_text: "Up to EUR 20 million or 4% of worldwide annual turnover for the most serious breaches (Art. 83(5); not re-read for this seed)"
      main_duty: "Lawful basis; DPIA for high-risk profiling; human intervention in solely automated decisions"
      sources:
        - {name: "EUR-Lex: Regulation (EU) 2016/679", url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A02016R0679-20160504", kind: official}
    scope_tests:
      - {question: "Does the client process personal data of people in the EU?", prefill: client_geographies, prefill_codes: [EU], rule: {equals: "yes"}}
    requirements:
      - code: GDPR-01
        text: "For solely automated decisions with legal or similar effects, give the person the right to human intervention, to express a view and to contest the decision"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Appeal route, reviewer, case log"
        role: appeals_correction_reviewer
        ai_types: [decision]
        citation: "GDPR Art. 22(1), (3)"
        quote: "at least the right to obtain human intervention on the part of the controller"
        source: 0
      - code: GDPR-02
        text: "Tell the person about automated decision-making and give meaningful information about the logic involved"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Privacy notice wording"
        role: explainability_contact
        ai_types: [decision]
        citation: "GDPR Art. 13(2)(f)"
        quote: "meaningful information about the logic involved"
        source: 0
      - code: GDPR-03
        text: "Carry out a data protection impact assessment before high-risk processing, including systematic automated evaluation and profiling"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "DPIA"
        role: impact_assessment_owner
        ai_types: [decision]
        citation: "GDPR Art. 35(1), (3)(a)"
        quote: "a systematic and extensive evaluation of personal aspects relating to natural persons"
        source: 0
      - code: GDPR-04
        text: "Designate a data protection officer where core activities involve large-scale systematic monitoring or large-scale special-category data"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "DPO appointment; published contact"
        role: dpo
        ai_types: [all]
        citation: "GDPR Art. 37(1)(b)–(c)"
        quote: "require regular and systematic monitoring of data subjects on a large scale"
        source: 0
    role_maps:
      - {role: appeals_correction_reviewer, level: required, needed_by: go_live, requirements: [GDPR-01], basis: "Art. 22(3): human intervention"}
      - {role: explainability_contact, level: required, needed_by: go_live, requirements: [GDPR-02], basis: "Art. 13(2)(f): logic involved"}
      - {role: impact_assessment_owner, level: required, needed_by: go_live, requirements: [GDPR-03], basis: "Art. 35: DPIA"}
      - {role: dpo, level: required, needed_by: go_live, requirements: [GDPR-04], basis: "Art. 37(1): where core activities require it"}
      - {role: data_consent_steward, level: required, needed_by: development, basis: "Lawful basis for processing (Art. 6; not re-read for this seed)", verify: true}

  # ---------------------------------------------------------------- India DPDP
  - key: in_dpdp
    jurisdiction: IN
    match: "Digital Personal Data Protection Act"
    label: India DPDP
    region: india
    binding: true
    topics: [personal_data]
    version:
      status: in_force_phased
      effective_text: "Rules notified Nov 2025; most duties apply after an 18-month phase-in"
      scope_text: "Data fiduciaries processing digital personal data in India, or outside India when offering goods or services to people in India. Extra duties for significant data fiduciaries."
      applies_to: [data_fiduciary]
      enforcer: "Data Protection Board of India"
      penalty_text: "Up to ₹250 crore for failing to take reasonable security safeguards (Schedule, item 1)"
      main_duty: "Notice and consent; grievance redress; for significant data fiduciaries, a DPO in India, an independent data auditor and periodic DPIA"
      sources:
        - {name: "MeitY: Digital Personal Data Protection Act, 2023", url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf", kind: official}
        - {name: "PIB: Government notifies DPDP Rules (14 Nov 2025)", url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2190014", kind: official}
    scope_tests:
      - {question: "Does the client process digital personal data in India, or offer goods or services to people in India?", prefill: client_geographies, prefill_codes: [IN], rule: {equals: "yes"}}
      - {question: "Has the client been notified as a significant data fiduciary?", rule: {any: true}, decisive: false, note: "Adds the DPO in India, independent data auditor and periodic DPIA."}
    requirements:
      - code: DPDP-01
        text: "Give a notice with or before every consent request, explaining the personal data and the purpose"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Notice text"
        role: transparency_notice_owner
        ai_types: [all]
        citation: "DPDP Act §5"
        quote: "accompanied or preceded by a notice"
        source: 0
      - code: DPDP-02
        text: "Rely on consent that is free, specific, informed, unconditional and unambiguous, limited to the stated purpose"
        applies_to: [data_fiduciary]
        needed_by: development
        evidence: "Consent records"
        role: data_consent_steward
        ai_types: [all]
        citation: "DPDP Act §6(1)"
        quote: "free, specific, informed, unconditional and unambiguous"
        source: 0
      - code: DPDP-03
        text: "Publish the business contact of a data protection officer or a person who can answer questions about processing"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Published contact"
        role: dpo
        ai_types: [all]
        citation: "DPDP Act §8(9)"
        quote: "the business contact information of a Data Protection Officer"
        source: 0
      - code: DPDP-04
        text: "Set up an effective mechanism to redress data principals' grievances"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Grievance process; named officer; response log"
        role: grievance_officer_india
        ai_types: [all]
        citation: "DPDP Act §8(10)"
        quote: "shall establish an effective mechanism to redress the grievances of Data Principals"
        source: 0
      - code: DPDP-05
        text: "Answer requests to access, correct, update or erase personal data within 90 days"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "Request log with response dates"
        role: grievance_officer_india
        ai_types: [all]
        citation: "DPDP Rules 2025 (rule number not confirmed)"
        quote: "a maximum of 90 days"
        source: 1
        verify: true
      - code: DPDP-06
        text: "Significant data fiduciaries: appoint a data protection officer based in India"
        applies_to: [data_fiduciary]
        needed_by: go_live
        evidence: "DPO appointment"
        role: dpo
        ai_types: [all]
        citation: "DPDP Act §10(2)(a)"
        quote: "appoint a Data Protection Officer"
        source: 0
      - code: DPDP-07
        text: "Significant data fiduciaries: appoint an independent data auditor"
        applies_to: [data_fiduciary]
        needed_by: yearly
        evidence: "Auditor engagement; audit report"
        role: ai_compliance_officer
        ai_types: [all]
        citation: "DPDP Act §10(2)(b)"
        quote: "independent data auditor"
        source: 0
      - code: DPDP-08
        text: "Significant data fiduciaries: carry out a periodic data protection impact assessment"
        applies_to: [data_fiduciary]
        needed_by: yearly
        evidence: "DPIA"
        role: impact_assessment_owner
        ai_types: [all]
        citation: "DPDP Act §10(2)(c)(i)"
        quote: "periodic Data Protection Impact Assessment"
        source: 0
    role_maps:
      - {role: grievance_officer_india, level: required, needed_by: go_live, requirements: [DPDP-04, DPDP-05], basis: "§8(10): grievance redress"}
      - {role: data_consent_steward, level: required, needed_by: development, requirements: [DPDP-02], basis: "§6: consent"}
      - {role: transparency_notice_owner, level: required, needed_by: go_live, requirements: [DPDP-01], basis: "§5: notice"}
      - {role: dpo, level: required, needed_by: go_live, requirements: [DPDP-03, DPDP-06], basis: "§8(9); §10(2)(a) for significant data fiduciaries"}
      - {role: impact_assessment_owner, level: recommended, needed_by: yearly, requirements: [DPDP-08], basis: "§10(2)(c): significant data fiduciaries only"}
    committees:
      - {type: sdf_setup, level: required, title: "Significant data fiduciary set-up", basis: "India DPDP Act §10 (if designated)", condition: "Only if designated a significant data fiduciary", items: ["DPO based in India", "Independent data auditor", "Periodic data protection impact assessment"]}

  # ---------------------------------------------------------------- California CCPA ADMT regulations
  - key: ca_ccpa_admt
