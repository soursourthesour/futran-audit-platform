# AI vendor list for automated AI discovery (spec §21 F2). Each entry is one AI product.
#   key:          stable identifier, used to group signals from different sources into one discovered tool
#   vendor, product, category: what the client and the auditor see
#   names:        how the product appears as an SSO app, an OAuth client or a licence (matched case-insensitively as a
#                 whole word or phrase inside the app name)
#   domains:      web domains (a CASB or proxy row matches the domain or any subdomain of it)
#   expense:      card statement descriptors (matched case-insensitively as a phrase inside the description or merchant)
#   attestation:  the attestation answer values (app.attestation.service.TOOLS) that declare this product
# Futran maintains this list; add a product by appending an entry. Keep keys unchanged once used.
vendors:
  - key: openai_chatgpt
    vendor: OpenAI
    product: ChatGPT
    category: General-purpose AI assistant
    names: [ChatGPT, OpenAI]
    domains: [chatgpt.com, chat.openai.com, openai.com]
    expense: ["OPENAI *CHATGPT", "CHATGPT SUBSCRIPTION", "OPENAI"]
    attestation: [chatgpt, chatgpt_agent]
  - key: anthropic_claude
