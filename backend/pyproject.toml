[project]
name = "futran-audit-platform"
version = "0.1.0"
description = "Futran Audit Platform — AI governance audit from onboarding to verified remediation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "openpyxl>=3.1",
  "pycountry>=24.6",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "xhtml2pdf>=0.2.16",
  "apscheduler>=3.10,<4",
  "anthropic>=0.40",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "freezegun>=1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.css", "*.html", "*.yaml", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
